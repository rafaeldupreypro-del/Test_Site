<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Collections | Atelier Nora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bone text-ink">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-bone/80 backdrop-blur-md z-50">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <!-- Logo -->
            <a href="index.html" class="text-sm tracking-[0.2em] uppercase font-light text-accent">Atelier Nora</a>

            <!-- Navigation Desktop -->
            <div class="hidden md:flex nav-pill text-[10px] tracking-widest uppercase font-light">
                <a href="collections.html" class="active">Collections</a>
                <a href="index.html#boutique">E-Boutique</a>
                <a href="atelier.html">L'Atelier</a>
            </div>

            <!-- Icônes (Contact + Panier + Menu) -->
            <div class="flex items-center gap-6">
                <!-- Bouton Contact -->
                <a href="#" onclick="openContactModal(); return false;" class="hidden md:inline-flex items-center gap-2 text-[10px] tracking-widest uppercase font-light text-ink hover:text-accent-dark transition-colors">
                    Contactez-nous
                </a>
                <a href="#" onclick="openContactModal(); return false;" aria-label="Contactez-nous" class="md:hidden p-2 flex items-center">
                    <i data-lucide="mail" class="w-5 h-5 text-ink"></i>
                </a>

                <!-- Lien Panier -->
                <a href="panier.html" class="relative p-2 flex items-center">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-ink"></i>
                    <span id="cart-count" class="absolute top-0 right-0 w-4 h-4 bg-accent rounded-full text-[9px] font-bold text-ink flex items-center justify-center hidden">0</span>
                </a>

                <!-- Bouton Menu (Visible uniquement sur mobile) -->
                <button id="menu-btn" class="md:hidden p-2 flex items-center">
                    <i data-lucide="menu" class="w-6 h-6 text-ink"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Menu Mobile (À placer juste après le <nav> pour éviter les problèmes de superposition) -->
    <div id="mobile-menu" class="hidden md:hidden fixed top-20 left-0 w-full bg-panel border-b border-hairline p-6 space-y-6 text-center z-40">
        <a href="collections.html" class="block text-xs uppercase tracking-widest text-ink-soft">Collections</a>
        <a href="index.html#boutique" class="block text-xs uppercase tracking-widest text-ink-soft">E-Boutique</a>
        <a href="atelier.html" class="block text-xs uppercase tracking-widest text-ink-soft">L'Atelier</a>
        <a href="#" onclick="openContactModal(); return false;" class="block text-xs uppercase tracking-widest text-ink-soft">Contactez-nous</a>
    </div>
    <!-- Modale Contact -->
    <div id="contact-modal" class="fixed inset-0 z-[100] hidden bg-bone/90 backdrop-blur-sm items-center justify-center p-4" onclick="if(event.target === this) closeContactModal()">
        <div class="card p-6 rounded-2xl w-full max-w-sm relative">
            <button onclick="closeContactModal()" class="absolute top-4 right-4 text-ink-soft"><i data-lucide="x"></i></button>
            <p class="text-[10px] tracking-[0.3em] uppercase text-accent font-medium mb-2">Contact</p>
            <h2 class="text-lg font-medium text-ink uppercase tracking-widest mb-6">Contactez-nous</h2>

            <!--
                ⚙️ CONFIGURATION FORMSPREE
                Remplacez "VOTRE_ID" ci-dessous par l'identifiant de votre formulaire Formspree
                (créé sur https://formspree.io -> l'URL ressemble à https://formspree.io/f/abcdwxyz).
            -->
            <form id="contact-form" action="https://formspree.io/f/VOTRE_ID" method="POST" class="space-y-4">
                <div>
                    <label for="contact-name" class="block text-[10px] uppercase tracking-widest text-ink-soft mb-1.5">Nom</label>
                    <input type="text" id="contact-name" name="name" required
                        class="w-full px-4 py-3 rounded-lg bg-panel-soft border border-hairline text-ink text-sm placeholder:text-ink-faint focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label for="contact-email" class="block text-[10px] uppercase tracking-widest text-ink-soft mb-1.5">Email</label>
                    <input type="email" id="contact-email" name="email" required
                        class="w-full px-4 py-3 rounded-lg bg-panel-soft border border-hairline text-ink text-sm placeholder:text-ink-faint focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label for="contact-message" class="block text-[10px] uppercase tracking-widest text-ink-soft mb-1.5">Message</label>
                    <textarea id="contact-message" name="message" rows="4" required
                        class="w-full px-4 py-3 rounded-lg bg-panel-soft border border-hairline text-ink text-sm placeholder:text-ink-faint focus:outline-none focus:border-accent resize-none"></textarea>
                </div>
                <button type="submit" class="btn-gold w-full py-3 rounded-lg text-xs uppercase tracking-widest font-bold">
                    <span>Envoyer</span>
                </button>
                <p id="contact-status" class="hidden text-center text-[11px] uppercase tracking-widest"></p>
            </form>
        </div>
    </div>


    <main class="max-w-7xl mx-auto pt-32 pb-20 px-6">
        <!-- En-tête de page -->
        <div class="mb-20 text-center space-y-4">
            <p class="text-[10px] tracking-[0.3em] uppercase text-accent font-medium">Sélection</p>
            <h1 class="text-4xl font-extralight tracking-[0.2em] uppercase -mt-1">Collections</h1>
            <p class="text-readable text-ink-faint text-xs tracking-widest uppercase">L'art de l'or et de la lumière</p>
        </div>

        <!-- Grille des collections -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- Carte Collection 1 -->
            <a href="#" class="group relative block aspect-[3/4] overflow-hidden rounded-3xl bg-beige border border-beige">
                <div class="absolute inset-0 bg-beige opacity-50 group-hover:opacity-0 transition-all duration-500"></div>
                <!-- <img src="images/alliances.jpg" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"> -->
                <div class="absolute bottom-0 left-0 p-8">
                    <span class="text-[10px] tracking-[0.2em] uppercase text-accent-dark font-medium">01</span>
                    <h2 class="text-2xl font-light tracking-wide mt-2">Alliances</h2>
                </div>
            </a>

            <!-- Carte Collection 2 -->
            <a href="#" class="group relative block aspect-[3/4] overflow-hidden rounded-3xl bg-beige border border-beige">
                <div class="absolute inset-0 bg-beige opacity-50 group-hover:opacity-0 transition-all duration-500"></div>
                <div class="absolute bottom-0 left-0 p-8">
                    <span class="text-[10px] tracking-[0.2em] uppercase text-accent-dark font-medium">02</span>
                    <h2 class="text-2xl font-light tracking-wide mt-2">Pendentifs</h2>
                </div>
            </a>

            <!-- Carte Collection 3 -->
            <a href="#" class="group relative block aspect-[3/4] overflow-hidden rounded-3xl bg-beige border border-beige">
                <div class="absolute inset-0 bg-beige opacity-50 group-hover:opacity-0 transition-all duration-500"></div>
                <div class="absolute bottom-0 left-0 p-8">
                    <span class="text-[10px] tracking-[0.2em] uppercase text-accent-dark font-medium">03</span>
                    <h2 class="text-2xl font-light tracking-wide mt-2">Boucles</h2>
                </div>
            </a>
        </div>
    </main>

    <script>

        // Gestion de la modale contact (Formspree)
        function openContactModal() {
            const modal = document.getElementById('contact-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeContactModal() {
            const modal = document.getElementById('contact-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        const contactForm = document.getElementById('contact-form');
        if (contactForm) {
            contactForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const status = document.getElementById('contact-status');
                const btn = contactForm.querySelector('button[type="submit"]');
                const btnSpan = btn.querySelector('span');
                const originalText = btnSpan.innerText;

                btn.disabled = true;
                btnSpan.innerText = "Envoi...";
                status.classList.add('hidden');

                try {
                    const response = await fetch(contactForm.action, {
                        method: 'POST',
                        body: new FormData(contactForm),
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        status.innerText = "Message envoyé, merci !";
                        status.classList.remove('hidden', 'text-red-600');
                        status.classList.add('text-accent-dark');
                        contactForm.reset();
                        setTimeout(() => {
                            closeContactModal();
                            status.classList.add('hidden');
                            btnSpan.innerText = originalText;
                            btn.disabled = false;
                        }, 1800);
                    } else {
                        throw new Error("Erreur d'envoi");
                    }
                } catch (error) {
                    console.error("Erreur formulaire de contact :", error);
                    status.innerText = "Une erreur est survenue, réessayez.";
                    status.classList.remove('hidden', 'text-accent-dark');
                    status.classList.add('text-red-600');
                    btnSpan.innerText = originalText;
                    btn.disabled = false;
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeContactModal();
        });

        function updateCartCount() {
            const currentCart = JSON.parse(localStorage.getItem('cart')) || [];
            const count = currentCart.reduce((sum, item) => sum + item.quantity, 0);
            const el = document.getElementById('cart-count');
            if (el) {
                el.innerText = count;
                el.classList.toggle('hidden', count === 0);
            }
        }

        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuBtn && mobileMenu) {
            menuBtn.onclick = () => {
                mobileMenu.classList.toggle('hidden');
                const icon = menuBtn.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', mobileMenu.classList.contains('hidden') ? 'menu' : 'x');
                    lucide.createIcons();
                }
            };
        }

        updateCartCount();
        lucide.createIcons();
    </script>
</body>
</html>
