<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Votre Panier | Atelier Nora</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">

    <nav class="fixed top-0 w-full bg-zinc-950/60 backdrop-blur-lg z-50 border-b border-zinc-900/60">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-base tracking-[0.3em] font-light uppercase text-accent">Atelier Nora</a>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto pt-32 px-6">
        <h1 class="text-2xl font-light uppercase tracking-widest mb-10 text-white">Votre Panier</h1>
        
        <div id="cart-items" class="space-y-6 border-b border-zinc-800 pb-6"></div>

        <div class="mt-10 border-t border-zinc-800 pt-6 space-y-6">
            <div class="flex justify-between items-center text-white">
                <span class="text-sm">Total</span>
                <span id="cart-total" class="text-lg font-bold text-accent">0 €</span>
            </div>

            <button onclick="processPayment()" 
                    class="btn-gold w-full py-4 rounded-xl font-bold uppercase tracking-widest transition-all duration-300 hover:brightness-110 cursor-pointer">
                Procéder au paiement
            </button>
            
            <p class="text-center text-xs text-zinc-500 uppercase tracking-widest">
                Paiement sécurisé via Stripe
            </p>
        </div>
        
        <a href="index.html" class="btn-outline block text-center w-full py-4 rounded-xl font-bold uppercase tracking-widest mt-6">
            Continuer mes achats
        </a>
    </main>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cart-items');
            const totalElement = document.getElementById('cart-total');
            
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p class="text-zinc-400 text-sm">Votre panier est vide.</p>';
                totalElement.innerText = "0 €";
                return;
            }

            cart.forEach((item, index) => {
                total += (item.price * item.quantity);
                
                container.innerHTML += `
                    <div class="flex items-center justify-between py-6 border-b border-zinc-800">
                        <div class="flex items-center gap-6">
                            <div class="w-20 h-20 bg-zinc-900 rounded-xl flex-shrink-0 border border-zinc-800"></div>
                            <div class="flex flex-col gap-1">
                                <h3 class="text-base font-medium text-white">${item.name}</h3>
                                <p class="text-xs text-zinc-400 uppercase tracking-wider">Quantité : ${item.quantity}</p>
                                <button onclick="removeItem(${index})" class="text-xs text-red-500 hover:text-red-400 uppercase tracking-widest font-bold bg-zinc-900 px-3 py-1.5 rounded-md w-max mt-2">
                                    Retirer
                                </button>
                            </div>
                        </div>
                        <span class="text-base font-bold text-white">${item.price * item.quantity} €</span>
                    </div>`;
            });

            totalElement.innerText = total + " €";
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart[index].quantity > 1) {
                cart[index].quantity -= 1;
            } else {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        async function processPayment() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            if (cart.length === 0) {
                alert("Le panier est vide.");
                return;
            }

            try {   
                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: cart }),
                });

                const data = await response.json();

                if (data.url) {
                    window.location.href = data.url; 
                } else {
                    alert("Erreur: " + (data.error || "Impossible de créer la session de paiement."));
                }
            } catch (error) {
                console.error("Erreur:", error);
                alert("Erreur de connexion avec le serveur de paiement.");
            }
        }

        renderCart();
    </script>
</body>
</html>
