<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Nora | Haute Joaillerie Artisanale</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-zinc-950/80 backdrop-blur-md z-50">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <!-- Logo -->
            <a href="index.html" class="text-sm tracking-[0.2em] uppercase font-light">Atelier Nora</a>
            
            <!-- Navigation Desktop -->
            <div class="hidden md:flex items-center space-x-8 text-[10px] tracking-widest uppercase font-light text-zinc-400">
                <a href="collections.html" class="hover:text-white transition-colors">Collections</a>
                <a href="index.html#boutique" class="hover:text-white transition-colors">E-Boutique</a>
                <a href="atelier.html" class="hover:text-white transition-colors">L'Atelier</a>
            </div>

            <!-- Icônes (Panier + Menu) -->
            <div class="flex items-center gap-6">
                <!-- Lien Panier -->
                <a href="panier.html" class="relative p-2 flex items-center">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span id="cart-count" class="absolute top-0 right-0 w-4 h-4 bg-amber-500 rounded-full text-[9px] font-bold text-zinc-950 flex items-center justify-center hidden">0</span>
                </a>
                
                <!-- Bouton Menu (Visible uniquement sur mobile) -->
                <button id="menu-btn" class="md:hidden p-2 flex items-center">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Menu Mobile (À placer juste après le <nav> pour éviter les problèmes de superposition) -->
    <div id="mobile-menu" class="hidden md:hidden fixed top-20 left-0 w-full bg-zinc-900 border-b border-zinc-800 p-6 space-y-6 text-center z-40">
        <a href="collections.html" class="block text-xs uppercase tracking-widest text-zinc-300">Collections</a>
        <a href="index.html#boutique" class="block text-xs uppercase tracking-widest text-zinc-300">E-Boutique</a>
        <a href="atelier.html" class="block text-xs uppercase tracking-widest text-zinc-300">L'Atelier</a>
    </div>

    <!-- Hero -->
    <section class="min-h-screen flex items-center justify-center px-4 text-center">
        <div class="max-w-2xl space-y-6">
            <h1 class="text-4xl md:text-5xl font-extralight tracking-tight uppercase leading-snug">Façonné à la main.<br>Porté pour l'éternité.</h1>
            <p class="text-zinc-400 text-sm font-light">Pièces uniques en or recyclé 18 carats.</p>
            <a href="#boutique" class="inline-block border border-zinc-800 text-[10px] uppercase tracking-widest px-8 py-3 rounded-full hover:bg-zinc-900 transition-all">Explorer</a>
        </div>
    </section>

    <!-- Boutique -->
    <section id="boutique" class="py-20 px-4">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-center text-lg tracking-widest uppercase mb-16">La Collection Permanente</h2>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Injection JS -->
            </div>
        </div>
    </section>

    <!-- Modale -->
    <div id="product-modal" class="fixed inset-0 z-[100] hidden bg-zinc-950/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-400"><i data-lucide="x"></i></button>
            <div class="aspect-square bg-zinc-950 border border-zinc-800 rounded-xl mb-4 flex items-center justify-center">Image</div>
            <h2 id="modal-name" class="text-lg font-medium mb-1"></h2>
            <p id="modal-desc" class="text-xs text-zinc-400 mb-6 font-light"></p>
            <button id="modal-btn" class="w-full bg-amber-600 text-zinc-950 py-3 rounded-lg text-xs uppercase tracking-widest font-bold">
                <span>Ajouter au panier</span>
            </button>
        </div>
    </div>

    <script>
    // 1. Fonction pour charger les produits dynamiquement depuis Stripe / votre API
    async function loadProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '<p class="text-zinc-500 text-xs tracking-widest uppercase col-span-full text-center py-10">Chargement de la collection...</p>';

        try {
            // 1. On récupère les produits depuis Stripe ET les stocks depuis Google Sheets en même temps
            const [stripeResponse, stockResponse] = await Promise.all([
                fetch('/api/products'),
                fetch('https://script.google.com/macros/s/AKfycbyvUxeTyPtPn5jQAyJ_tF3528YV8JvcWsVhc2bYjiL2zi7etgwJu_dOSpjTD1qbJ4R5og/exec') // <-- Mets ton URL ici
            ]);

            const products = await stripeResponse.json();
            const stocksData = await stockResponse.json(); 
            // Supposons que ton Sheets renvoie un tableau du genre : [{ id: "prod_xxx", stock: 5 }, ...]

            grid.innerHTML = ''; // On vide le message de chargement

            if (!products || products.length === 0) {
                grid.innerHTML = '<p class="text-zinc-500 text-xs tracking-widest uppercase col-span-full text-center py-10">Aucun produit disponible pour le moment.</p>';
                return;
            }

            // On boucle sur les produits renvoyés par Stripe
            products.forEach(p => {
                // On cherche le stock correspondant dans les données du Google Sheets grâce à l'ID Stripe
                const stockItem = stocksData.find(s => s.id === p.id);
                const stock = stockItem ? parseInt(stockItem.stock, 10) : 0; // Par sécurité, 0 si non trouvé
                const isRupture = stock <= 0;

                const card = document.createElement('div');
                card.className = "group bg-zinc-900/40 border border-zinc-800 p-4 rounded-2xl transition-all hover:border-zinc-700";
                
                card.innerHTML = `
                    <div class="aspect-square bg-zinc-900 border border-zinc-800 rounded-xl mb-4 cursor-pointer overflow-hidden flex items-center justify-center relative">
                        ${p.image ? `<img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover ${isRupture ? 'opacity-40 grayscale' : ''}">` : '<span class="text-xs text-zinc-600">Image</span>'}
                        ${isRupture ? '<span class="absolute bg-zinc-950/80 text-zinc-200 text-[10px] uppercase tracking-widest px-3 py-1 rounded-full border border-zinc-700">Rupture de stock</span>' : ''}
                    </div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-medium text-white">${p.name}</h3>
                        <span class="text-sm font-semibold text-accent">
                            ${p.price} €
                        </span>
                    </div>
                    <button class="${isRupture ? 'bg-zinc-800 text-zinc-500 cursor-not-allowed' : 'btn-gold'} w-full py-3 rounded-lg font-bold uppercase tracking-widest transition-all duration-300" ${isRupture ? 'disabled' : ''}>
                        <span>${isRupture ? 'Indisponible' : 'Ajouter au panier'}</span>
                    </button>
                `;
                
                // Événements (uniquement si le produit est en stock)
                const imgContainer = card.querySelector('.aspect-square');
                if (!isRupture) {
                    imgContainer.onclick = () => openModal(p);
                    
                    card.querySelector('button').onclick = (e) => addToCart({ 
                        id: p.id, 
                        name: p.name, 
                        price: p.price 
                    }, e.currentTarget);
                } else {
                    imgContainer.style.cursor = "default";
                }
                
                grid.appendChild(card);
            });

            lucide.createIcons(); // Recharge les icônes dynamiques

        } catch (error) {
            console.error("Erreur lors du chargement des produits :", error);
            grid.innerHTML = '<p class="text-red-500 text-xs tracking-widest uppercase col-span-full text-center py-10">Impossible de charger le catalogue.</p>';
        }
    }

    // 2. Animation de succès sur le bouton d'ajout au panier
    function triggerSuccess(buttonElement) {
        const spanEl = buttonElement.querySelector('span');
        const originalText = spanEl ? spanEl.innerText : "Ajouter au panier";

        buttonElement.classList.remove('btn-gold');
        buttonElement.classList.add('btn-success');
        if (spanEl) spanEl.innerText = "Ajouté !";

        setTimeout(() => {
            buttonElement.classList.remove('btn-success');
            buttonElement.classList.add('btn-gold');
            if (spanEl) spanEl.innerText = originalText;
        }, 1000);
    }

    // 3. Gestion du Panier (LocalStorage)
    function addToCart(product, btn) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const index = cart.findIndex(item => item.id === product.id);

        if (index > -1) {
            cart[index].quantity += 1;
        } else {
            product.quantity = 1;
            cart.push(product);
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        
        if (btn) {
            triggerSuccess(btn);
        }
    }

    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        const el = document.getElementById('cart-count');
        if (el) {
            el.innerText = count;
            el.classList.toggle('hidden', count === 0);
        }
    }

    // 4. Gestion de la modale produit
    function openModal(p) {
        document.getElementById('modal-name').innerText = p.name;
        document.getElementById('modal-desc').innerText = p.desc || "Pièce unique façonnée avec soin.";
        const btn = document.getElementById('modal-btn');
        btn.onclick = () => addToCart({ id: p.id, name: p.name, price: p.price }, btn);
        document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeModal() { 
        document.getElementById('product-modal').classList.add('hidden'); 
    }

    // 5. Menu Mobile
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (menuBtn && mobileMenu) {
        menuBtn.onclick = () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            if (icon) {
                icon.setAttribute('data-lucide', mobileMenu.classList.contains('hidden') ? 'menu' : 'x');
                lucide.createIcons();
            }
        };
    }

    // 6. Initialisation globale au chargement de la page
    document.addEventListener('DOMContentLoaded', () => {
        updateCartCount();
        loadProducts(); // <-- Charge dynamiquement les produits à l'ouverture
        lucide.createIcons();
    });
</script>
</body>
</html>
