<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Nora | Haute Joaillerie Artisanale</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bone text-ink antialiased">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-bone/80 backdrop-blur-md z-50">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <!-- Logo -->
            <a href="index.html" class="text-sm tracking-[0.2em] uppercase font-light text-accent">Atelier Nora</a>
            
            <!-- Navigation Desktop -->
            <div class="hidden md:flex nav-pill text-[10px] tracking-widest uppercase font-light">
                <a href="collections.html">Collections</a>
                <a href="index.html#boutique" class="active">E-Boutique</a>
                <a href="atelier.html">L'Atelier</a>
            </div>

            <!-- Icônes (Panier + Menu) -->
            <div class="flex items-center gap-6">
                <!-- Lien Panier -->
                <a href="panier.html" class="relative p-2 flex items-center">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-ink"></i>
                    <span id="cart-count" class="absolute top-0 right-0 w-4 h-4 bg-accent rounded-full text-[9px] font-bold text-ink flex items-center justify-center hidden">0</span>
                </a>
                
                <!-- Bouton Menu (Visible uniquement sur mobile) -->
                <button id="menu-btn" class="md:hidden p-2 flex items-center">
                    <i data-lucide="menu" class="w-6 h-6 text-ink"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Menu Mobile (À placer juste après le <nav> pour éviter les problèmes de superposition) -->
    <div id="mobile-menu" class="hidden md:hidden fixed top-20 left-0 w-full bg-panel border-b border-hairline p-6 space-y-6 text-center z-40">
        <a href="collections.html" class="block text-xs uppercase tracking-widest text-ink-soft">Collections</a>
        <a href="index.html#boutique" class="block text-xs uppercase tracking-widest text-ink-soft">E-Boutique</a>
        <a href="atelier.html" class="block text-xs uppercase tracking-widest text-ink-soft">L'Atelier</a>
    </div>

    <!-- Hero -->
    <section class="min-h-screen flex items-center justify-center px-4 text-center bg-panel-soft">
        <div class="max-w-2xl space-y-6">
            <span class="inline-block bg-accent text-[#F7EFEC] text-[10px] tracking-[0.3em] uppercase font-medium px-4 py-1.5 rounded-full">Haute joaillerie artisanale</span>
            <h1 class="text-4xl md:text-5xl font-extralight tracking-tight uppercase leading-snug">Façonné à la main.<br>Porté pour l'éternité.</h1>
            <div class="w-24 h-[3px] bg-accent mx-auto divider-gem"></div>
            <p class="text-ink-soft text-sm font-light">Pièces uniques en or recyclé 18 carats.</p>
            <a href="#boutique" class="btn-gold inline-block text-[10px] uppercase tracking-widest px-8 py-3 rounded-full">Explorer</a>
        </div>
    </section>

    <!-- Boutique -->
    <section id="boutique" class="py-20 px-4 bg-panel">
        <div class="max-w-6xl mx-auto">
            <p class="text-center text-[10px] tracking-[0.3em] uppercase text-accent font-medium mb-3">Atelier Nora</p>
            <h2 class="text-center text-lg tracking-widest uppercase mb-4">La Collection Permanente</h2>
            <div class="w-24 h-[3px] bg-accent mx-auto divider-gem mb-16"></div>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Injection JS -->
            </div>
        </div>
    </section>

    <!-- Modale -->

    <div id="product-modal" class="fixed inset-0 z-[100] hidden bg-bone/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-panel border border-hairline p-6 rounded-2xl w-full max-w-sm relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-ink-soft"><i data-lucide="x"></i></button>
            <div id="modal-image" class="aspect-square bg-beige border border-beige rounded-xl mb-4 flex items-center justify-center overflow-hidden">
                <span class="text-ink-faint text-xs uppercase tracking-widest">Image</span>
            </div>
            <h2 id="modal-name" class="text-lg font-medium mb-1"></h2>
            <p id="modal-desc" class="text-xs text-ink-soft mb-6 font-light"></p>
            <button id="modal-btn" class="w-full bg-accent text-ink py-3 rounded-lg text-xs uppercase tracking-widest font-bold">
                <span>Ajouter au panier</span>
            </button>
        </div>
    </div>

    <script>
    // 1. Fonction pour charger les produits dynamiquement depuis Stripe / votre API
    async function loadProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '<p class="text-black font-bold text-xs tracking-widest uppercase col-span-full text-center py-10">Chargement de la collection...</p>';

        try {
            const [stripeResponse, stockResponse] = await Promise.all([
                fetch('/api/products'),
                fetch('https://script.google.com/macros/s/AKfycbwOpBAd2WzT-fzdYcnKZS9qYyzR6tzTzoMCPDROqsNPBOSbhElvz5ReD9MWAweoYh4JnQ/exec') 
            ]);

            const products = await stripeResponse.json();
            const stocksData = await stockResponse.json(); 

            grid.innerHTML = ''; 

            if (!products || products.length === 0) {
                grid.innerHTML = '<p class="text-ink-faint text-xs tracking-widest uppercase col-span-full text-center py-10">Aucun produit disponible pour le moment.</p>';
                return;
            }

            products.forEach(p => {
                const stockItem = stocksData.find(s => s.id === p.id);
                const stock = stockItem ? parseInt(stockItem.stock, 10) : 0; 
                const isRupture = stock <= 0;

                const card = document.createElement('div');
                card.className = "group card p-4";
                
                card.innerHTML = `
                    <div class="aspect-square bg-beige border border-beige rounded-xl mb-4 cursor-pointer overflow-hidden flex items-center justify-center relative">
                        ${p.image ? `<img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover ${isRupture ? 'opacity-40 grayscale' : ''}">` : '<span class="text-xs text-ink-faint">Image</span>'}
                        ${isRupture ? '<span class="absolute bg-bone/80 text-ink text-[10px] uppercase tracking-widest px-3 py-1 rounded-full border border-accent/40">Rupture de stock</span>' : ''}
                    </div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-medium text-ink">${p.name}</h3>
                        <span class="text-sm font-semibold text-accent-dark">
                            ${p.price} €
                        </span>
                    </div>
                    <div class="mb-4 text-xs">
                        ${isRupture 
                            ? '<span class="text-red-600">Épuisé</span>' 
                            : `<span class="text-ink-soft">En stock : <strong class="text-ink">${stock}</strong></span>`
                        }
                    </div>
                    <button class="${isRupture ? 'bg-panel-soft text-ink-faint cursor-not-allowed' : 'btn-gold'} w-full py-3 rounded-lg font-bold uppercase tracking-widest transition-all duration-300" ${isRupture ? 'disabled' : ''}>
                        <span>${isRupture ? 'Indisponible' : 'Ajouter au panier'}</span>
                    </button>
                `;
                
                const imgContainer = card.querySelector('.aspect-square');
                if (!isRupture) {
                    imgContainer.onclick = () => openModal(p, stock);
                    
                    card.querySelector('button').onclick = (e) => {
                        addToCart({ 
                            id: p.id, 
                            name: p.name, 
                            price: p.price,
                            maxStock: stock 
                        }, e.currentTarget);
                        triggerSuccess(e.currentTarget);
                    };
                } else {
                    imgContainer.style.cursor = "default";
                }
                
                grid.appendChild(card);
            });

            lucide.createIcons();

        } catch (error) {
            console.error("Erreur lors du chargement des produits :", error);
            grid.innerHTML = '<p class="text-red-600 text-xs tracking-widest uppercase col-span-full text-center py-10">Impossible de charger le catalogue.</p>';
        }
    }

    // 2. Animation de succès sur le bouton d'ajout au panier
    function triggerSuccess(buttonElement) {
        const spanEl = buttonElement.querySelector('span');
        const originalText = spanEl ? spanEl.innerText : "Ajouter au panier";

        buttonElement.classList.remove('btn-gold');
        buttonElement.classList.add('btn-success');
        if (spanEl) spanEl.innerText = "Ajouté !";

        setTimeout(() => {
            buttonElement.classList.remove('btn-success');
            buttonElement.classList.add('btn-gold');
            if (spanEl) spanEl.innerText = originalText;
        }, 1000);
    }

    // 3. Gestion du Panier (LocalStorage)
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function addToCart(product, buttonElement) {
        let cartItem = cart.find(item => item.id === product.id);
        let currentQuantityInCart = cartItem ? cartItem.quantity : 0;

        // Vérification stricte par rapport au stock max
        if (currentQuantityInCart + 1 > product.maxStock) {
            alert("Vous avez atteint la limite du stock disponible pour ce produit.");
            return;
        }

        if (cartItem) {
            cartItem.quantity += 1;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                quantity: 1,
                maxStock: product.maxStock
            });
        }

        // Sauvegarde dans le localStorage et mise à jour du compteur
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
    }

    function updateCartCount() {
        const currentCart = JSON.parse(localStorage.getItem('cart')) || [];
        const count = currentCart.reduce((sum, item) => sum + item.quantity, 0);
        const el = document.getElementById('cart-count');
        if (el) {
            el.innerText = count;
            el.classList.toggle('hidden', count === 0);
        }
    }

    // 4. Gestion de la modale produit
    function openModal(p, stock) {
        document.getElementById('modal-name').innerText = p.name;
        document.getElementById('modal-desc').innerText = p.desc || "Pièce unique façonnée avec soin.";
        const imgContainer = document.getElementById('modal-image');
        imgContainer.innerHTML = p.image
            ? `<img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">`
            : '<span class="text-ink-faint text-xs uppercase tracking-widest">Image</span>';
        const btn = document.getElementById('modal-btn');
        btn.onclick = () => {
            addToCart({ id: p.id, name: p.name, price: p.price, maxStock: stock }, btn);
            triggerSuccess(btn);
        };
        document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeModal() { 
        document.getElementById('product-modal').classList.add('hidden'); 
    }

    // 5. Menu Mobile
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (menuBtn && mobileMenu) {
        menuBtn.onclick = () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            if (icon) {
                icon.setAttribute('data-lucide', mobileMenu.classList.contains('hidden') ? 'menu' : 'x');
                lucide.createIcons();
            }
        };
    }

    // 6. Initialisation globale au chargement de la page
    document.addEventListener('DOMContentLoaded', () => {
        updateCartCount();
        loadProducts(); 
        lucide.createIcons();

        // Vérifie si on revient d'un paiement Stripe réussi
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            // 1. On vide le panier local
            localStorage.removeItem('cart');
            updateCartCount(); // Met à jour le compteur du panier pour qu'il retombe à 0
            
            // 2. On affiche un message de succès sur l'écran
            const banner = document.createElement('div');
            banner.className = "fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-panel border border-accent/40 text-ink px-6 py-4 rounded-xl shadow-2xl text-xs uppercase tracking-widest font-bold flex items-center gap-3";
            banner.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-accent"></i> Commande validée avec succès ! Merci pour votre achat.`;
            document.body.appendChild(banner);
            
            if (typeof lucide !== 'undefined') lucide.createIcons();

            // 3. On nettoie l'URL pour enlever le ?success=true
            window.history.replaceState({}, document.title, window.location.pathname);

            // 4. Disparaît après 5 secondes
            setTimeout(() => {
                banner.style.transition = "opacity 0.5s ease";
                banner.style.opacity = "0";
                setTimeout(() => banner.remove(), 500);
            }, 5000);
        }
    });
</script>
</body>
</html>
